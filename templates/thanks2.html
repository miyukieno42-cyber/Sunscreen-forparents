<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ご回答ありがとうございました</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #f1f8f3, #e7f2eb);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Hiragino Kaku Gothic ProN",
                "Hiragino Sans",
                "Yu Gothic",
                "Meiryo",
                sans-serif;
            color: #466b59;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .thanks-card {
            width: 100%;
            max-width: 680px;
            min-height: 720px;
            background: #ffffff;
            border-radius: 44px;
            padding: 70px 70px 55px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(60, 100, 80, 0.08);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .leaf {
            font-size: 64px;
            line-height: 1;
            margin-bottom: 35px;
        }

        .small-title {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: 0.05em;
        }

        h1 {
            margin: 0;
            font-size: 42px;
            line-height: 1.55;
            font-weight: 800;
            letter-spacing: 0.04em;
        }

        .message {
            margin-top: 42px;
            color: #94aaa0;
            font-size: 23px;
            line-height: 2;
            font-weight: 600;
        }

        .name {
            margin-top: 45px;
            color: #6fa987;
            font-size: 19px;
            line-height: 1.8;
            font-weight: 600;
        }

        .name span {
            display: block;
        }

        .back-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            max-width: 510px;
            min-height: 86px;

            margin-top: 48px;

            background: #70ad87;
            color: white;
            text-decoration: none;

            border-radius: 50px;

            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.03em;

            transition: 0.2s ease;
        }

        .back-button:hover {
            background: #5f9c76;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {

            body {
                padding: 20px 14px;
            }

            .thanks-card {
                min-height: 650px;
                padding: 50px 25px 40px;
                border-radius: 32px;
            }

            .leaf {
                font-size: 50px;
                margin-bottom: 25px;
            }

            .small-title {
                font-size: 24px;
            }

            h1 {
                font-size: 38px;
            }

            .message {
                font-size: 18px;
                margin-top: 30px;
            }

            .name {
                font-size: 16px;
                margin-top: 32px;
            }

            .back-button {
                min-height: 72px;
                font-size: 18px;
                margin-top: 38px;
            }
        }
    </style>
</head>

<body>

    <main class="thanks-card">

        <div class="leaf">🌿</div>

        <div class="small-title">
            ご回答
        </div>

        <h1>
            ありがとうございました
        </h1>

        <div class="message">
            アンケートへのご協力<br>
            ありがとうございました。
        </div>

        <div class="name">
            <span>榎本実幸</span>
            <span>miyuki.eno42@gmail.com</span>
        </div>

        <a href="{{ url_for('index') }}" class="back-button">
            アンケートの最初に戻る
        </a>

    </main>

</body>
</html>
